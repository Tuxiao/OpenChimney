[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlite-service-kit-runner"
version = "0.1.0"
description = "Independent REST-polling task runner for SQLite Service Kit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git@v2026.5.29.2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
sqlite-service-runner = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
